name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Generate app icon
        run: python build_icon.py

      - name: Build EXE (PyInstaller onefile)
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name DesktopAssistant `
            --icon assets\app.ico `
            main.py

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAssistant-windows-exe
          path: dist/DesktopAssistant.exe

      - name: Publish Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DesktopAssistant.exe
          generate_release_notes: true
